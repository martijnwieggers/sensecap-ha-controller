name: Build firmware

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-firmware:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: PlatformIO installeren
        run: pip install platformio

      - name: Versie in platformio.ini zetten
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i 's/-DAPP_VERSION=\\"[^"]*\\"/-DAPP_VERSION=\\"'"${VERSION}"'\\"/' firmware/platformio.ini

      - name: Firmware bouwen
        working-directory: firmware
        run: pio run -e sensecap_indicator

      - name: Binaries klaarzetten
        run: |
          mkdir binaries
          cp firmware/.pio/build/sensecap_indicator/firmware.bin binaries/
          cp firmware/.pio/build/sensecap_indicator/bootloader.bin binaries/
          cp firmware/.pio/build/sensecap_indicator/partitions.bin binaries/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: binaries/

  build-flasher:
    runs-on: windows-latest
    needs: build-firmware

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware-binaries
          path: binaries

      - name: Flash-tool bouwen
        run: |
          pip install pyinstaller pyserial esptool
          pyinstaller --onefile --name sensecap-flash `
            --collect-data esptool `
            --add-data "binaries/firmware.bin;." `
            --add-data "binaries/bootloader.bin;." `
            --add-data "binaries/partitions.bin;." `
            flash_tool/flash.py

      - name: Release aanmaken
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binaries/firmware.bin
            binaries/bootloader.bin
            binaries/partitions.bin
            dist/sensecap-flash.exe
          body: |
            ## Flashen (eenvoudig)

            Download `sensecap-flash.exe`, sluit de SenseCap Indicator aan via USB en dubbelklik.
            Stop de seriële logger als die open staat.

            ## Flashen (handmatig)

            Download de drie `.bin`-bestanden en flash via de terminal:

            ```
            esptool.py --chip esp32s3 --port COM<n> --baud 460800 ^
              write_flash ^
              0x0000  bootloader.bin ^
              0x8000  partitions.bin ^
              0x10000 firmware.bin
            ```

            Op Linux/Mac: vervang `COM<n>` door `/dev/ttyUSB0` of `/dev/tty.usbserial-*`.
